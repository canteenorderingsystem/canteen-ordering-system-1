spring.application.name=canteen-ordering

# Server
# Render (and most PaaS providers) inject PORT; fall back to 8080 locally.
server.port=${PORT:8080}

# H2 database (file-based so data survives restarts)
# On Render, override SPRING_DATASOURCE_URL to point at a mounted persistent
# disk if you want the data to survive redeploys, e.g.
# jdbc:h2:file:/data/canteendb
spring.datasource.url=jdbc:h2:file:./data/canteendb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
# "update" preserves existing data; "create-drop" wipes the file DB on shutdown.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console (optional) at http://localhost:8080/h2-console
# Set H2_CONSOLE_ENABLED=false on Render to keep it disabled in production.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Keep static assets fresh while developing
spring.web.resources.cache.period=0

# Nicer logging
logging.level.com.canteen.ordering=INFO
